# ------------------------------------------------------------------
#  Site settings: edit these first
# ------------------------------------------------------------------
title: Lamothe Bioinformatic Engineering
tagline: Notes on genomics, pipelines and data
description: >-
  A bioinformatics blog: sequencing data analysis, reproducible pipelines,
  and the occasional deep dive into algorithms behind the tools.

author:
  name: Andrew Lamothe
  role: Bioinformatic Software Engineer
  affiliation: AlphaRose Therapeutics, Verdant Center for Spatial Biology
  email: quin_lamothe@berkeley.edu

# Social / academic profiles. Leave any of these blank to hide it.
social:
  github: Alepidoptera7
  orcid: 0009-0006-7419-1796
  linkedin: quin-lamothe


header_sequence: GATAAGCAACAAGTTCCCCAGCGGTCTTCCCGCCCTAGCCTGACAAGGCGAAGGTTTTCTTACCTGGCGA


# ------------------------------------------------------------------
#  URLs
#  - Repo named yourusername.github.io  -> leave baseurl as ""
#  - Any other repo name, e.g. "blog"   -> baseurl: "/blog"
# ------------------------------------------------------------------
url: https://alepidoptera7.github.io
baseurl: ""

# ------------------------------------------------------------------
#  Build settings (all supported by GitHub Pages' built-in builder)
# ------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

permalink: /blog/:year/:month/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
